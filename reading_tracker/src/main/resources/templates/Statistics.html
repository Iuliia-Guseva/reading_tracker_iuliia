<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#263c36">
    <title>Statistics</title>
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="page-layout">
        <div th:replace="~{fragments/Navigation :: NavigationModal('statistics')}"></div>
        <main class="page-content home-page statistics-page"
              th:with="readingBooks=${books.?[status.name() == 'READING']},
                       completedBooks=${books.?[status.name() == 'COMPLETED']},
                       toReadBooks=${books.?[status.name() == 'TO_READ']},
                       totalBooks=${#lists.size(books) > 0 ? #lists.size(books) : 1}">
            <header class="home-header">
                <div>
                    <h1>Statistics</h1>
                </div>
            </header>

            <section class="home-stats" aria-label="Your reading statistics">
                <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l3 2"/>
                        </svg>
                    </span>
                    <strong class="stat-value" id="total-reading-time"
                            th:attr="data-sample-seconds=${sampleReadingSeconds}">00:00:00</strong>
                    <span class="stat-label">Total reading time</span>
                </article>
                <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m5 12 4 4L19 6"/>
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </span>
                    <strong class="stat-value" th:text="${#lists.size(completedBooks)}">0</strong>
                    <span class="stat-label">Books read</span>
                </article>
                <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 7v14m0-14C9 4 5 4 3 5v14c2-1 6-1 9 2m0-14c3-3 7-3 9-2v14c-2-1-6-1-9 2"/>
                        </svg>
                    </span>
                    <strong class="stat-value" th:text="${#lists.size(readingBooks)}">0</strong>
                    <span class="stat-label">Currently reading</span>
                </article>
            </section>

            <section class="statistics-status home-section" aria-labelledby="reading-status-heading">
                <h2 id="reading-status-heading">Reading status</h2>
                <div class="statistics-status-list">
                    <div class="statistics-status-item">
                        <div class="statistics-status-label">
                            <span id="reading-status-label">Reading</span>
                            <strong th:text="${#lists.size(readingBooks)}">0</strong>
                        </div>
                        <!-- Thymeleaf sets max to all books and value to books in this status.
                             The browser uses their ratio to determine how much of the bar is filled. -->
                        <progress class="statistics-status-progress status-reading"
                                  aria-labelledby="reading-status-label"
                                  th:max="${totalBooks}" th:value="${#lists.size(readingBooks)}"></progress>
                    </div>
                    <div class="statistics-status-item">
                        <div class="statistics-status-label">
                            <span id="read-status-label">Read</span>
                            <strong th:text="${#lists.size(completedBooks)}">0</strong>
                        </div>
                        <progress class="statistics-status-progress status-completed"
                                  aria-labelledby="read-status-label"
                                  th:max="${totalBooks}" th:value="${#lists.size(completedBooks)}"></progress>
                    </div>
                    <div class="statistics-status-item">
                        <div class="statistics-status-label">
                            <span id="to-read-status-label">Want to read</span>
                            <strong th:text="${#lists.size(toReadBooks)}">0</strong>
                        </div>
                        <progress class="statistics-status-progress status-to-read"
                                  aria-labelledby="to-read-status-label"
                                  th:max="${totalBooks}" th:value="${#lists.size(toReadBooks)}"></progress>
                    </div>
                </div>
            </section>

            <section class="statistics-pages" aria-label="Pages read">
                <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/>
                        </svg>
                    </span>
                    <strong class="stat-value" th:text="${pagesRead}">0</strong>
                    <span class="stat-label">Pages read</span>
                </article>
            </section>
        </main>
    </div>
    <script>
        const totalReadingTimeStorageKey = "readingTrackerTotalSeconds";
        const totalReadingTime = document.getElementById("total-reading-time");
        const storedValue = localStorage.getItem(totalReadingTimeStorageKey);
        const sampleReadingSeconds = Number(totalReadingTime.dataset.sampleSeconds);
        const storedTotalReadingSeconds = Number(storedValue);
        const totalReadingSeconds = Number.isSafeInteger(storedTotalReadingSeconds)
                && storedTotalReadingSeconds >= sampleReadingSeconds
            ? storedTotalReadingSeconds
            : sampleReadingSeconds;

        if (storedValue !== String(totalReadingSeconds)) {
            localStorage.setItem(totalReadingTimeStorageKey, totalReadingSeconds);
        }

        const hours = Math.floor(totalReadingSeconds / 3600);
        const minutes = Math.floor((totalReadingSeconds % 3600) / 60);
        const seconds = totalReadingSeconds % 60;
        const formatPart = (value) => String(value).padStart(2, "0");
        totalReadingTime.textContent =
            formatPart(hours) + ":" + formatPart(minutes) + ":" + formatPart(seconds);
    </script>
</body>
</html>
