<!-- Modal window or model box for adding a new book -->
 <!-- material used - https://www.w3schools.com/howto/howto_css_modals.asp -->
<th:block th:fragment="addBookModal">
    <dialog id="add-book-modal" aria-labelledby="add-book-title"
            th:attr="data-open=${editBookId != null or coverError != null}">
        <button class="modal-back" type="button" th:attr="aria-label=#{bookForm.backAria}"
                onclick="document.getElementById('add-book-modal').close()">
            <span aria-hidden="true">&larr;</span> <span th:text="#{bookForm.back}">Back</span>
        </button>

        <!-- Live preview of the book being created  -->
        <section class="book-preview" th:attr="aria-label=#{bookForm.previewAria}">
            <div class="cover-placeholder">
                <img id="preview-cover" th:attr="alt=#{bookForm.coverAlt},
                     data-existing-src=@{/my-books/{id}/cover(id=${editBookId})}"
                     th:if="${editBookId != null and newBook.coverImage != null}"
                     th:src="@{/my-books/{id}/cover(id=${editBookId})}">
                <img id="preview-cover" th:attr="alt=#{bookForm.selectedCoverAlt}" hidden
                     th:unless="${editBookId != null and newBook.coverImage != null}">
                <span id="cover-placeholder-text" aria-hidden="true"
                      th:style="${editBookId != null and newBook.coverImage != null} ? 'display: none' : ''">
                    Book cover
                </span>
            </div>
            <div class="preview-details">
                <h2 id="add-book-title"><span id="preview-title" th:text="#{bookForm.titlePlaceholder}"
                                             th:attr="data-empty-text=#{bookForm.titlePlaceholder}">Book title</span></h2>
                <p id="preview-author" th:text="#{bookForm.authorPlaceholder}"
                   th:attr="data-empty-text=#{bookForm.authorPlaceholder}">Author</p>
                <p class="preview-status"><span id="preview-status" th:text="#{bookForm.status.toRead}">To read</span></p>
                <p class="preview-meta">
                    <span class="preview-icon" aria-hidden="true">&#9638;</span>
                    <span><span id="preview-pages">0</span> <span th:text="#{bookForm.pages}">pages</span></span>
                </p>
                <p class="preview-meta">
                    <span class="preview-icon" aria-hidden="true">&#9711;</span>
                    <span><span th:text="#{bookForm.published}">Published</span> <span id="preview-year"
                            th:text="#{bookForm.yearNotSet}" th:attr="data-empty-text=#{bookForm.yearNotSet}">Not set</span></span>
                </p>
            </div>
        </section>

        <hr class="preview-divider">

        <!-- Form for entering book details  -->
        <form class="book-form" th:action="${bookFormAction}" th:object="${newBook}"
              method="post" enctype="multipart/form-data">
            <h2 id="book-form-heading" th:text="#{${bookFormTitle}}">Add book</h2>

            <p class="cover-error full-width" th:if="${coverError}" th:text="#{${coverError}}" role="alert"></p>

            <label class="field full-width" for="book-title">
                <span th:text="#{bookForm.title}">Title</span>
                <input id="book-title" type="text" th:field="*{title}" th:placeholder="#{bookForm.titleInputPlaceholder}" required>
            </label>

            <label class="field full-width" for="book-author">
                <span th:text="#{bookForm.author}">Author</span>
                <input id="book-author" type="text" th:field="*{author}" th:placeholder="#{bookForm.authorInputPlaceholder}">
            </label>

            <label class="field" for="book-pages">
                <span th:text="#{bookForm.pagesLabel}">Pages</span>
                <input id="book-pages" type="number" min="1" th:field="*{pages}" th:placeholder="#{bookForm.pagesInputPlaceholder}">
            </label>

            <label class="field" for="book-year">
                <span th:text="#{bookForm.publicationYear}">Publication year</span>
                <input id="book-year" type="number" min="1" th:field="*{publicationYear}" th:placeholder="#{bookForm.yearInputPlaceholder}">
            </label>

            <!-- Book cover is optional; uploaded images are validated before saving. -->
            <label class="field full-width" for="book-cover">
                <span th:text="#{bookForm.cover}">Book cover</span>
                <input id="book-cover" name="cover" type="file"
                       accept="image/jpeg,image/png,image/gif,image/webp">
            </label>

            <label class="field" for="book-status">
                <span th:text="#{bookForm.status}">Status</span>
                <select id="book-status" th:field="*{status}">
                    <option th:each="status : ${bookStatuses}" th:value="${status}"
                            th:text="${#messages.msg(status.name() == 'TO_READ' ? 'bookForm.status.toRead' : (status.name() == 'READING' ? 'books.filter.reading' : 'books.filter.read'))}">To read</option>
                </select>
            </label>

            <div class="modal-actions">
                <button class="cancel-button" type="button"
                        onclick="document.getElementById('add-book-modal').close()" th:text="#{bookForm.cancel}">Cancel</button>
                <button class="save-button" type="submit" th:text="#{bookForm.save}">Save</button>
            </div>
        </form>
    </dialog>

    <script>

        //Open the modal when the add book button is clicked
        const addBookModal = document.getElementById("add-book-modal");
        document.getElementById("open-add-book").addEventListener("click", () => {
            addBookModal.showModal();
        });
        if (addBookModal.dataset.open === "true") {
            addBookModal.showModal();
        }

        const previewFields = [
            ["book-title", "preview-title"],
            ["book-author", "preview-author"],
            ["book-pages", "preview-pages"],
            ["book-year", "preview-year"]
        ];
        previewFields.forEach(([inputId, previewId]) => {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const updatePreview = () => {
                preview.textContent = input.value || preview.dataset.emptyText || "0";
            };
            input.addEventListener("input", updatePreview);
            updatePreview();
        });

        const statusSelect = document.getElementById("book-status");
        const statusPreview = document.getElementById("preview-status");
        const updateStatusPreview = () => {
            statusPreview.textContent = statusSelect.options[statusSelect.selectedIndex].text;
        };
        statusSelect.addEventListener("change", updateStatusPreview);
        updateStatusPreview();

        // Show the selected cover in the preview and restore the placeholder when cleared.
        const coverInput = document.getElementById("book-cover");
        const coverPreview = document.getElementById("preview-cover");
        const coverPlaceholder = document.getElementById("cover-placeholder-text");
        let previewCoverUrl = null;
        coverInput.addEventListener("change", () => {
            if (previewCoverUrl !== null) {
                URL.revokeObjectURL(previewCoverUrl);
                previewCoverUrl = null;
            }
            const file = coverInput.files[0];
            if (file) {
                previewCoverUrl = URL.createObjectURL(file);
                coverPreview.src = previewCoverUrl;
                coverPreview.hidden = false;
                coverPlaceholder.hidden = true;
            } else {
                const existingCover = coverPreview.dataset.existingSrc;
                if (existingCover) {
                    coverPreview.src = existingCover;
                    coverPreview.hidden = false;
                    coverPlaceholder.hidden = true;
                } else {
                    coverPreview.removeAttribute("src");
                    coverPreview.hidden = true;
                    coverPlaceholder.hidden = false;
                }
            }
        });

        addBookModal.addEventListener("click", (event) => {
            if (event.target === addBookModal) {
                addBookModal.close();
            }
        });
    </script>
</th:block>
