<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#263c36">
    <title th:text="#{nav.readingSession}">Reading session</title>
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/reading_session.css}">
</head>
<body>
    <div class="page-layout">
        <div th:replace="~{fragments/Navigation :: NavigationModal('reading-session')}"></div>
        <main class="reading-session">
            <section class="session-focus" th:attr="aria-label=#{session.timerAria},
                     data-sample-reading-seconds=${sampleReadingSeconds},
                     data-reading-label=#{session.reading},data-pause-label=#{session.pause},
                     data-paused-label=#{session.paused},data-resume-label=#{session.resume},
                     data-ready-label=#{session.ready},data-start-label=#{session.start}">
                <div class="timer-face">
                    <!-- The circle and sprout are decorative parts of the timer design. -->
                    <svg class="timer-ring" viewBox="0 0 220 220" aria-hidden="true">
                        <circle cx="110" cy="110" r="104"></circle>
                    </svg>
                    <div class="timer-content">
                        <svg class="sprout-icon" viewBox="0 0 32 32" aria-hidden="true">
                            <path d="M16 27V15m0 5c-6 0-9-3-9-9 6 0 9 3 9 9Zm0-5c0-6 3-9 9-9 0 6-3 9-9 9ZM11 28h10"/>
                        </svg>
                        <p class="timer" id="timer" role="timer" th:attr="aria-label=#{session.elapsedTimeAria}">00:00:00</p>
                        <p class="session-status" id="session-status" aria-live="polite" th:text="#{session.ready}">Ready to read</p>
                    </div>
                </div>

                <div class="session-controls">
                    <button class="session-control" id="session-control" type="button" aria-pressed="false">
                        <span id="control-label" th:text="#{session.start}">Start reading</span>
                    </button>
                    <button class="session-control session-control--stop" id="stop-control" type="button" disabled
                            th:text="#{session.stop}">Stop reading</button>
                </div>
            </section>
        </main>
    </div>

        <script>

            const timer = document.getElementById("timer");
            const status = document.getElementById("session-status");
            const control = document.getElementById("session-control");
            const controlLabel = document.getElementById("control-label");
            const stopControl = document.getElementById("stop-control");
            const sessionFocus = document.querySelector(".session-focus");

            const totalReadingTimeStorageKey = "readingTrackerTotalSeconds";
            const storedValue = localStorage.getItem(totalReadingTimeStorageKey);
            const sampleReadingSeconds = Number(
                sessionFocus.dataset.sampleReadingSeconds
            );
            const storedTotalReadingSeconds = Number(storedValue);
            let totalReadingSeconds =
                Number.isSafeInteger(storedTotalReadingSeconds)
                        && storedTotalReadingSeconds >= sampleReadingSeconds
                    ? storedTotalReadingSeconds
                    : sampleReadingSeconds;
            if (storedValue !== String(totalReadingSeconds)) {
                localStorage.setItem(totalReadingTimeStorageKey, totalReadingSeconds);
            }
            let elapsedSeconds = 0;
            let timerInterval = null;

            function addZero(number) {
                if (number < 10) {
                    return "0" + number;
                }

                return number;
            }


            function formatTime(totalSeconds) {
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                return addZero(hours) + ":" + addZero(minutes) + ":" + addZero(seconds);
            }


            function showTime() {
                timer.textContent = formatTime(elapsedSeconds);
            }

            showTime();

            function startTimer() {
                timerInterval = setInterval(function() {
                    elapsedSeconds = elapsedSeconds + 1;
                    totalReadingSeconds = totalReadingSeconds + 1;
                    localStorage.setItem(totalReadingTimeStorageKey, totalReadingSeconds);
                    showTime();
                }, 1000);

                status.textContent = sessionFocus.dataset.readingLabel;
                controlLabel.textContent = sessionFocus.dataset.pauseLabel;
                control.setAttribute("aria-pressed", "true");
                control.classList.add("is-running");
                stopControl.disabled = false;
            }


            function pauseTimer() {
                clearInterval(timerInterval);
                timerInterval = null;

                status.textContent = sessionFocus.dataset.pausedLabel;
                controlLabel.textContent = sessionFocus.dataset.resumeLabel;
                control.setAttribute("aria-pressed", "false");
                control.classList.remove("is-running");
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
                elapsedSeconds = 0;
                showTime();

                status.textContent = sessionFocus.dataset.readyLabel;
                controlLabel.textContent = sessionFocus.dataset.startLabel;
                control.setAttribute("aria-pressed", "false");
                control.classList.remove("is-running");
                stopControl.disabled = true;
            }


            control.addEventListener("click", function() {
                if (timerInterval === null) {
                    startTimer();
                } else {
                    pauseTimer();
                }
            });

            stopControl.addEventListener("click", stopTimer);
        </script>
</body>
</html>
